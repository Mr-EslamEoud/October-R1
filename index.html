        @keyframes qOutNext { from { opacity: 1; transform: translateX(0) scale(1); } to { opacity: 0; transform: translateX(65px) scale(0.975); } }
        @keyframes qOutPrev { from { opacity: 1; transform: translateX(0) scale(1); } to { opacity: 0; transform: translateX(-65px) scale(0.975); } }
        @keyframes qInNext { from { opacity: 0; transform: translateX(-85px) scale(0.975); } to { opacity: 1; transform: translateX(0) scale(1); } }
        @keyframes qInPrev { from { opacity: 0; transform: translateX(85px) scale(0.975); } to { opacity: 1; transform: translateX(0) scale(1); } }

        @keyframes qOutPushNext { to { opacity: 0; transform: translateY(95px) scale(0.985); } }
        @keyframes qOutPushPrev { to { opacity: 0; transform: translateY(-95px) scale(0.985); } }
        @keyframes qInPushNext { from { opacity: 0; transform: translateY(-95px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes qInPushPrev { from { opacity: 0; transform: translateY(95px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

        @keyframes qOutFade { to { opacity: 0; } }
        @keyframes qInFade { from { opacity: 0; } }

        @keyframes qOutZoom { to { opacity: 0; transform: scale(1.12); } }
        @keyframes qInZoom { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }

        @keyframes qOutFlip { to { opacity: 0; transform: perspective(1400px) rotateY(-80deg) translateZ(-40px); } }
        @keyframes qInFlip { from { opacity: 0; transform: perspective(1400px) rotateY(80deg) translateZ(-40px); } to { opacity: 1; transform: perspective(1400px) rotateY(0) translateZ(0); } }

        @keyframes qOutWipe { to { opacity: 0; clip-path: inset(0 0 0 100%); } }
        @keyframes qInWipe { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }

        @keyframes qOutRotate { to { opacity: 0; transform: rotate(-7deg) scale(0.9); } }
        @keyframes qInRotate { from { opacity: 0; transform: rotate(7deg) scale(0.9); } to { opacity: 1; transform: rotate(0) scale(1); } }

        @keyframes qOutBlur { to { opacity: 0; filter: blur(14px); transform: scale(1.04); } }
        @keyframes qInBlur { from { opacity: 0; filter: blur(14px); transform: scale(0.98); } to { opacity: 1; filter: blur(0); transform: scale(1); } }

        .q-out { animation-duration: 0.24s; animation-timing-function: cubic-bezier(0.4, 0, 1, 1); animation-fill-mode: both; }
        .q-in { animation-duration: 0.5s; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); animation-fill-mode: both; }

        .q-out-slide-next { animation-name: qOutNext; }
        .q-out-slide-prev { animation-name: qOutPrev; }
        .q-in-slide-next { animation-name: qInNext; }
        .q-in-slide-prev { animation-name: qInPrev; }

        .q-out-push-next { animation-name: qOutPushNext; }
        .q-out-push-prev { animation-name: qOutPushPrev; }
        .q-in-push-next { animation-name: qInPushNext; }
        .q-in-push-prev { animation-name: qInPushPrev; }

        .q-out-fade { animation-name: qOutFade; }
        .q-in-fade { animation-name: qInFade; }
        .q-out-zoom { animation-name: qOutZoom; }
        .q-in-zoom { animation-name: qInZoom; }
        .q-out-flip { animation-name: qOutFlip; animation-duration: 0.3s; }
        .q-in-flip { animation-name: qInFlip; animation-duration: 0.6s; }
        .q-out-wipe { animation-name: qOutWipe; }
        .q-in-wipe { animation-name: qInWipe; animation-duration: 0.6s; }
        .q-out-rotate { animation-name: qOutRotate; }
        .q-in-rotate { animation-name: qInRotate; }
        .q-out-blur { animation-name: qOutBlur; }
        .q-in-blur { animation-name: qInBlur; animation-duration: 0.55s; }

        @keyframes optIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .q-in .opt-stagger { animation: optIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .q-in .opt-stagger:nth-child(1) { animation-delay: 0.10s; }
        .q-in .opt-stagger:nth-child(2) { animation-delay: 0.17s; }
        .q-in .opt-stagger:nth-child(3) { animation-delay: 0.24s; }
        .q-in .opt-stagger:nth-child(4) { animation-delay: 0.31s; }

        @keyframes numPop { from { opacity: 0; transform: translateY(-10px) scale(0.7); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .q-num-pop { animation: numPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

        }
    </style>

                    }
                }

                let endY = strokePoints[strokePoints.length - 1].y;
                let endX = strokePoints[strokePoints.length - 1].x;

                const depth1 = maxY - startY;
                const depth2 = maxY - endY;
                
                if (depth1 > 20 && depth2 > 40) {
                    if (endX > startX + 30 || endX < startX - 30) { 
                        return true;
                    }
                }
                return false;
            };

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;

                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.strokeStyle = color;
                
                setIsDrawing(true);
                setPoints([{ x, y }]);
                setCursorPos({ x, y });
            };

            const draw = (e) => {
                if (!isDrawing) {
                    if (e.clientX) setCursorPos({ x: e.clientX, y: e.clientY });
                    return;
                }
                
                e.preventDefault(); 
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;

                const ctx = canvas.getContext('2d');
                ctx.lineTo(x, y);
                ctx.stroke();

                setPoints(prev => [...prev, { x, y }]);
                setCursorPos({ x, y });
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                
                if (analyzeGesture(points)) {
                    clearCanvas();
                    setTimeout(() => {
                        onClose();
                    }, 300);
                }
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            if (!isActive) return null;

            return (
                <div className="fixed inset-0 z-50 overflow-hidden">
                    <div 
                        className="custom-cursor w-4 h-4 rounded-full border-2 border-white shadow-md pointer-events-none transition-colors duration-75"
                        style={{ 
                            left: cursorPos.x, 
                            top: cursorPos.y, 
                            backgroundColor: color,
                            opacity: cursorPos.x > 0 ? 0.8 : 0 
                        }}
                    />
                    
                    <canvas
                        ref={canvasRef}
                        className="drawing-canvas absolute inset-0 w-full h-full"
                        onMouseDown={startDrawing}
                        onMouseMove={draw}
                        onMouseUp={stopDrawing}
                        onMouseOut={stopDrawing}
                        onTouchStart={startDrawing}
                        onTouchMove={draw}
                        onTouchEnd={stopDrawing}
                    />

                    <div className="absolute top-24 left-1/2 transform -translate-x-1/2 bg-white dark:bg-gray-800 rounded-full shadow-premium border border-gray-100 dark:border-gray-700 p-2 flex gap-3 items-center z-50 pointer-events-auto transition-colors">
                        <button onClick={clearCanvas} className="w-10 h-10 rounded-full flex items-center justify-center text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors" title="مسح الكل">
                            <i className="fa-solid fa-trash"></i>
                        </button>
                        <div className="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                        {colors.map(c => (
                            <button
                                key={c.hex}
                                onClick={() => setColor(c.hex)}
                                className={`w-8 h-8 rounded-full border-2 transition-transform ${color === c.hex ? 'scale-125 border-gray-400 dark:border-gray-300 shadow-md' : 'border-transparent'}`}
                                style={{ backgroundColor: c.hex }}
                                title={c.name}
                            />
                        ))}
                        <div className="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                        <button onClick={onClose} className="w-10 h-10 rounded-full flex items-center justify-center text-primary dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="إغلاق وضع الرسم">
                            <i className="fa-solid fa-times"></i>
                        </button>
                    </div>
                    
                    <div className="absolute bottom-24 left-1/2 transform -translate-x-1/2 bg-black/70 dark:bg-white/80 text-white dark:text-black px-4 py-2 rounded-full text-sm font-light pointer-events-none opacity-80 shadow-md whitespace-nowrap transition-colors">
                        ارسم علامة الصح (✓) لمسح الشاشة والإغلاق
                    </div>
                </div>
            );
        };

        const HomeScreen = ({ onStart, hasProgress, onResume, onRestart }) => {
            const anim = CONFIG.enableAnimations;
            const item = (delay, extra = "") => anim
                ? { className: `${extra} intro-item`.trim(), style: { animationDelay: `${delay}s` } }
                : { className: extra.trim() };

            const chips = [
                { icon: "fa-solid fa-user-graduate", label: CONFIG.grade },
            ];

            return (
                <div className="flex-1 flex flex-col relative z-10 w-full h-full overflow-y-auto intro-bg">

                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        <div className="intro-grid"></div>
                        <div className="intro-orb intro-orb-1"></div>
                        <div className="intro-orb intro-orb-2"></div>
                        <div className="intro-orb intro-orb-3"></div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center text-center px-4 md:px-8 py-8 w-full max-w-3xl mx-auto relative">

                        <div {...(anim ? { className: "intro-emblem" } : {})} style={anim ? { animationDelay: "0.05s" } : {}}>
                            <div className="intro-emblem-inner relative w-24 h-24 md:w-28 md:h-28 rounded-[2rem] md:rounded-[2.25rem] bg-primary dark:bg-secondary flex items-center justify-center mb-5 md:mb-6 ring-1 ring-accent/50 dark:ring-accent/60 shadow-[0_25px_50px_-18px_rgba(17,17,17,0.55)] dark:shadow-[0_0_50px_rgba(5,150,105,0.45)]">
                                <i className="fa-solid fa-graduation-cap text-4xl md:text-5xl text-secondary dark:text-primary drop-shadow-[0_2px_6px_rgba(0,0,0,0.35)]"></i>
                                <span className="absolute -bottom-3 -left-3 w-9 h-9 md:w-10 md:h-10 rounded-full bg-accent text-white text-base md:text-lg font-black flex items-center justify-center shadow-[0_8px_20px_-6px_rgba(5,150,105,0.85)] border-2 border-white dark:border-[#0f1115]">
                                    <i className="fa-solid fa-star text-xs md:text-sm"></i>
                                </span>
                            </div>
                        </div>

                        <div {...item(0.15, "flex items-center justify-center gap-3 md:gap-5 mb-2")}>
                            <span className="text-4xl md:text-6xl font-black text-primary dark:text-white drop-shadow-sm">موسوعة</span>
                            <div className="flex flex-col items-center gap-1.5">
                                <span className="block w-8 md:w-12 h-[3px] bg-gradient-to-l from-secondary to-accent rounded-full shadow-[0_0_8px_rgba(5,150,105,0.6)]"></span>
                                <span className="block w-8 md:w-12 h-[3px] bg-accent/45 rounded-full"></span>
                                <span className="block w-8 md:w-12 h-[3px] bg-accent/20 rounded-full"></span>
                            </div>
                            <div className="flex flex-col items-start justify-center">
                                <span className="intro-gold text-3xl md:text-5xl font-black leading-none">الكنز</span>
                                <span className="text-lg md:text-2xl font-bold leading-none text-accent-dark dark:text-accent-glow mt-1.5">التعليمي</span>
                            </div>
                        </div>

                        <div {...item(0.3, "intro-divider mb-5 md:mb-6")}></div>

                        <div {...item(0.4, "mb-5 md:mb-6 space-y-1.5")}>
                            <h2 className="text-base md:text-2xl font-medium text-gray-700 dark:text-gray-300 leading-relaxed">
                                بوابتك الذكية لإتقان{" "}
                                <span className="font-black text-accent dark:text-accent-glow">{CONFIG.subject}</span>
                            </h2>
                            <p className="text-sm md:text-lg text-gray-500 dark:text-gray-400">
                                مراجعة تفاعلية متكاملة مصممة بعناية لتحقيق أفضل نتيجة
                            </p>
                        </div>

                        <div {...item(0.5, "flex flex-wrap items-center justify-center gap-2.5 md:gap-3 mb-5 md:mb-7")}>
                            {chips.map((chip, idx) => (
                                <span key={idx} className="intro-chip intro-chip-lg">
                                    <i className={chip.icon}></i>
                                    {chip.label}
                                </span>
                            ))}
                        </div>

                        <div {...item(0.62, "w-full max-w-lg mb-6 md:mb-8")}>
                            <div className="relative overflow-hidden bg-white/85 dark:bg-gray-800/70 backdrop-blur-md border-2 border-accent/55 dark:border-accent/50 rounded-3xl px-5 py-4 md:px-7 md:py-5 shadow-premium dark:shadow-[0_0_30px_rgba(5,150,105,0.18)] transition-transform duration-300 hover:-translate-y-0.5">
                                <div className="absolute -top-8 -left-8 w-24 h-24 bg-secondary/30 blur-2xl rounded-full"></div>
                                <div className="relative flex items-center justify-center gap-3 md:gap-4 py-1">
                                    <div className="shrink-0 w-10 h-10 md:w-12 md:h-12 rounded-2xl bg-accent dark:bg-accent-dark flex items-center justify-center shadow-md">
                                        <i className="fa-solid fa-book-quran text-white text-lg md:text-xl"></i>
                                    </div>
                                    <span className="text-lg md:text-3xl font-black leading-snug text-primary dark:text-white">{CONFIG.lesson}</span>
                                </div>
                            </div>
                        </div>

                        <div {...item(0.75, "flex flex-col items-center gap-3.5 w-full max-w-sm")}>
                            {hasProgress ? (
                                <>
                                    <button
                                        onClick={onResume}
                                        className="intro-cta w-full bg-gradient-to-b from-accent-glow via-accent to-accent-dark text-white font-black text-lg md:text-xl py-3.5 md:py-4 rounded-2xl ring-1 ring-secondary/55 shadow-[0_20px_40px_-15px_rgba(5,150,105,0.65)] hover:-translate-y-1 active:translate-y-0 transition-all duration-300"
                                    >
                                        <span className="relative z-10 flex items-center justify-center gap-2.5 drop-shadow-sm">
                                            <i className="fa-solid fa-play text-base"></i>
                                            استكمال المراجعة
                                        </span>
                                    </button>
                                    <button
                                        onClick={onRestart}
                                        className="w-full bg-white/70 dark:bg-gray-800/60 backdrop-blur border-2 border-primary/25 dark:border-gray-600 text-primary dark:text-gray-300 font-bold text-base md:text-lg py-2.5 md:py-3 rounded-2xl hover:border-accent hover:text-accent-dark dark:hover:text-accent-glow hover:bg-accent-light/50 dark:hover:bg-gray-800 transition-all duration-300 active:scale-95"
                                    >
                                        <span className="flex items-center justify-center gap-2.5">
                                            <i className="fa-solid fa-rotate-right text-sm"></i>
                                            البدء من جديد
                                        </span>
                                    </button>
                                </>
                            ) : (
                                <button
                                    onClick={onStart}
                                    className="intro-cta w-full bg-gradient-to-b from-accent-glow via-accent to-accent-dark text-white font-black text-lg md:text-xl py-3.5 md:py-4 rounded-2xl ring-1 ring-secondary/55 shadow-[0_20px_40px_-15px_rgba(5,150,105,0.65)] hover:-translate-y-1 active:translate-y-0 transition-all duration-300"
                                >
                                    <span className="relative z-10 flex items-center justify-center gap-2.5 drop-shadow-sm">
                                        <i className="fa-solid fa-rocket text-base"></i>
                                        ابدأ المراجعة
                                    </span>
                                </button>
                            )}
                            <span className="text-[11px] md:text-xs text-gray-400 dark:text-gray-500 flex items-center gap-1.5">
                                <i className="fa-solid fa-clock-rotate-left"></i>
                                يُنصح بالمراجعة قبل الاختبار مباشرة
                            </span>
                        </div>

                        <div {...item(0.9, "w-full mt-4 relative")}>
                            <div className="w-full h-px bg-gradient-to-r from-transparent via-accent/55 to-transparent mb-3"></div>
                            <div className="flex flex-col items-center">
                                <span className="text-sm md:text-base font-bold text-gray-500 dark:text-gray-400 mb-0.5">رؤية وإعداد</span>
                                <span className="text-xl md:text-3xl font-black text-primary dark:text-gray-100 flex items-center gap-2.5 drop-shadow-sm">
                                    <i className="fa-solid fa-feather-pointed text-accent-dark dark:text-accent-glow text-lg md:text-xl"></i>
                                    الأستاذ/ إسلام سعود
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Watermark = () => (
            <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 select-none" aria-hidden="true">
                <div className="watermark-layer">
                    {Array.from({ length: 72 }).map((_, i) => (
                        <div className="wm-item" key={i}>
                            <span className="wm-title">موسوعة الكنز</span>
                            <span className="wm-sub">أ/ إسلام سعود</span>
                        </div>
                    ))}
                </div>
            </div>
        );

        const TRANSITIONS = ["slide", "push", "fade", "zoom", "flip", "wipe", "rotate", "blur"];
        const DIRECTIONAL_TRANSITIONS = { slide: true, push: true };

        const QuizScreen = ({
            questions = QUIZ_DATA, 
            questionData, 
            currentIndex, 
            totalQuestions, 
            onNext, 
            onPrev, 
            onHome, 
            userAnswer, 
            onAnswer,
            toggleDarkMode,
            isDarkMode,
            answers = {},
            onJumpToQuestion
        }) => {
            const [showStatsModal, setShowStatsModal] = useState(false);

            // Statistics calculation
            const stats = useMemo(() => {
                let correct = 0;
                let wrong = 0;
                let answered = 0;

                questions.forEach((q, idx) => {
                    const ans = answers[idx];
                    if (ans !== undefined) {
                        answered++;
                        if (q.type === 'essay') {
                            correct++;
                        } else {
                            if (ans === q.correctAnswer) {
                                correct++;
                            } else {
                                wrong++;
                            }
                        }
                    }
                });

                const unanswered = totalQuestions - answered;
                const percentage = Math.round((answered / totalQuestions) * 100) || 0;

                return { correct, wrong, unanswered, answered, percentage };
            }, [answers, totalQuestions, questions]);
            const [isDrawingMode, setIsDrawingMode] = useState(false);
            const contentRef = useRef(null);
            const touchStartX = useRef(0);

            const [view, setView] = useState({ index: currentIndex, data: questionData, answer: userAnswer });
            const [phase, setPhase] = useState('in');
            const dirRef = useRef('next');
            const transRef = useRef('slide');
            const prevIndexRef = useRef(currentIndex);
            const answerRef = useRef(userAnswer);
            answerRef.current = userAnswer;

            useEffect(() => {
                if (prevIndexRef.current === currentIndex) return;
                const dir = currentIndex > prevIndexRef.current ? 'next' : 'prev';
                prevIndexRef.current = currentIndex;
                dirRef.current = dir;

                let nextTrans = TRANSITIONS[Math.floor(Math.random() * TRANSITIONS.length)];
                if (nextTrans === transRef.current) {
                    nextTrans = TRANSITIONS[(TRANSITIONS.indexOf(nextTrans) + 1) % TRANSITIONS.length];
                }
                transRef.current = nextTrans;

                if (!CONFIG.enableAnimations) {
                    setView({ index: currentIndex, data: questionData, answer: userAnswer });
                    return;
                }

                const outMs = nextTrans === 'flip' ? 300 : 240;
                setPhase('out');
                const timer = setTimeout(() => {
                    setView({ index: currentIndex, data: questionData, answer: answerRef.current });
                    setPhase('in');
                }, outMs);
                return () => clearTimeout(timer);
            }, [currentIndex]);

            useEffect(() => {
                setView(v => (v.index === currentIndex ? { ...v, data: questionData, answer: userAnswer } : v));
            }, [questionData, userAnswer, currentIndex]);

            useEffect(() => {
                if (contentRef.current) {
                    contentRef.current.scrollTop = 0;
                }
            }, [view.index]);

            const handleTouchStart = (e) => {
                touchStartX.current = e.changedTouches[0].screenX;
            };

            const handleTouchEnd = (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX.current - touchEndX;
                
                if (diff > 50) {
                    onPrev(); 
                } else if (diff < -50) {
                    onNext(); 
                }
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            };

            const hasAnswered = view.answer !== undefined;
            const stageClass = CONFIG.enableAnimations
                ? `q-${phase} q-${phase}-${transRef.current}${DIRECTIONAL_TRANSITIONS[transRef.current] ? `-${dirRef.current}` : ""}`
                : "";
            const expandClass = CONFIG.enableAnimations ? "transition-all duration-500 ease-in-out overflow-hidden" : "";

            return (
                <div className="flex flex-col h-screen w-screen relative">
                    <Watermark />

                    <header className="flex-shrink-0 z-40 bg-white dark:bg-gray-900 shadow-md px-4 md:px-8 py-3 md:py-4 flex justify-between items-center border-b-4 border-primary dark:border-accent transition-colors relative overflow-hidden">
                        <div className="absolute bottom-0 right-0 h-1 bg-gradient-to-l from-accent-glow to-accent transition-all duration-500 ease-out shadow-[0_0_8px_rgba(5,150,105,0.85)] z-10" style={{ width: `${((currentIndex + 1) / totalQuestions) * 100}%` }}></div>
                        <div className="flex items-center gap-2 md:gap-4 flex-wrap max-w-[60%]">
                            <i className="fa-solid fa-graduation-cap text-primary dark:text-accent-glow text-3xl md:text-4xl drop-shadow-sm"></i>
                            <h1 className="text-base md:text-2xl font-bold text-primary dark:text-white flex items-center gap-1 md:gap-2 flex-wrap leading-tight">
                                <span className="text-secondary-dark dark:text-secondary font-black">موسوعة</span> الكنز التعليمي
                                <span className="hidden md:inline text-gray-300 dark:text-gray-600">|</span>
                                <span className="text-xs md:text-lg text-gray-500 dark:text-gray-400 flex items-center gap-1">
                                    رؤية وإعداد <span className="text-secondary-dark dark:text-secondary font-bold whitespace-nowrap">أ/ إسلام سعود</span>
                                </span>
                            </h1>
                        </div>

                        <div className="flex items-center gap-2 md:gap-5">
                            <button 
                                onClick={() => setShowStatsModal(true)}
                                className="flex items-center gap-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 px-3 md:px-4 py-1.5 md:py-2 rounded-full dir-ltr border border-gray-200 dark:border-gray-700 shadow-inner cursor-pointer transition-all active:scale-95 group"
                                title="اضغط لعرض إحصائيات الأسئلة وتخطيها"
                            >
                                <div className="flex items-baseline gap-1">
                                    <span key={currentIndex} className="text-xl md:text-2xl font-black text-accent-dark dark:text-accent-glow q-num-pop">{currentIndex + 1}</span>
                                    <span className="text-sm md:text-base text-gray-400 dark:text-gray-500 font-bold">/ {totalQuestions}</span>
                                </div>
                                <i className="fa-solid fa-chart-pie text-xs md:text-sm text-accent-dark/70 dark:text-accent-glow/70 group-hover:rotate-45 transition-transform mr-0.5"></i>
                            </button>
                            
                            <button 
                                onClick={toggleDarkMode}
                                className="w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-accent-glow hover:bg-gray-200 dark:hover:bg-gray-700 transition-all text-lg md:text-xl border border-transparent dark:border-gray-700"
                                title="الوضع الليلي"
                            >
                                <i className={`fa-solid ${isDarkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                            </button>

                            <button 
                                onClick={() => setIsDrawingMode(!isDrawingMode)}
                                className={`w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center transition-all text-lg md:text-xl border border-transparent dark:border-gray-700 ${isDrawingMode ? 'bg-accent text-white shadow-glow-emerald' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'}`}
                                title="أداة الرسم"
                            >
                                <i className="fa-solid fa-pen-nib"></i>
                            </button>

                            <button onClick={toggleFullscreen} className="hidden md:flex w-12 h-12 rounded-full items-center justify-center bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all text-xl border border-transparent dark:border-gray-700">
                                <i className="fa-solid fa-expand"></i>
                            </button>

                            <button onClick={onHome} className="w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center bg-primary dark:bg-accent text-white dark:text-white hover:bg-black dark:hover:bg-accent-dark transition-all shadow-md text-lg md:text-xl">
                                <i className="fa-solid fa-house"></i>
                            </button>
                        </div>
                    </header>

                    <main 
                        ref={contentRef}
                        className="flex-1 overflow-y-auto overflow-x-hidden relative z-10 scroll-smooth"
                        onTouchStart={handleTouchStart}
                        onTouchEnd={handleTouchEnd}
                    >
                        <div className={`max-w-4xl mx-auto px-4 md:px-6 pt-[5pt] pb-8 md:pb-12 flex flex-col gap-3 md:gap-5 ${stageClass}`} style={{ paddingTop: '5pt' }} key={`${view.index}-${phase}`}>
                            
                            <div className="bg-primary-light dark:bg-gray-800 border-2 border-primary dark:border-gray-600 rounded-xl md:rounded-3xl p-4 md:p-8 shadow-sm relative overflow-hidden transition-colors">
                                <div className="absolute top-0 right-0 w-1.5 md:w-2 h-full bg-gradient-to-b from-secondary via-accent to-accent-dark"></div>
                                <FormattedText text={view.data.question} type="question" />
                            </div>

                            <div className="flex flex-col gap-1.5 md:gap-4">
                                {view.data.options.map((option, idx) => {
                                    const isSelected = view.answer === idx;
                                    const isCorrect = view.data.correctAnswer === idx;
                                    const isEssay = view.data.type === 'essay';
                                    
                                    let borderStyle = "border-primary/20 dark:border-gray-600 hover:border-accent hover:bg-accent-light/50 dark:hover:border-accent-glow dark:hover:bg-gray-800/50";
                                    let iconStyle = "bg-primary dark:bg-gray-700 text-white dark:text-gray-200";
                                    let textStyle = "text-gray-800 dark:text-gray-300";

                                    if (hasAnswered) {
                                        if (isCorrect) {
                                            borderStyle = "border-correct dark:border-green-500 bg-green-50 dark:bg-green-900/20 shadow-md";
                                            iconStyle = "bg-correct dark:bg-green-600 text-white";
                                            textStyle = "text-correct dark:text-green-400 font-bold";
                                        } else if (isSelected && !isCorrect) {
                                            borderStyle = "border-wrong dark:border-red-500 bg-red-50 dark:bg-red-900/20";
                                            iconStyle = "bg-wrong dark:bg-red-600 text-white";
                                            textStyle = "text-wrong dark:text-red-400";
                                        } else {
                                            borderStyle = "border-gray-200 dark:border-gray-700 opacity-50";
                                            iconStyle = "bg-gray-300 dark:bg-gray-800 text-gray-500 dark:text-gray-600";
                                        }
                                    }

                                    const letters = ['أ', 'ب', 'ج', 'د'];
                                    const iconContent = isEssay ? <i className="fa-solid fa-lightbulb"></i> : letters[idx];

                                    return (
                                        <button 
                                            key={idx}

                                            </div>
                                            <span className={`text-base md:text-xl leading-snug ${textStyle} ${isEssay ? 'font-bold' : ''}`}>
                                                {option}
                                            </span>
                                            {hasAnswered && isCorrect && !isEssay && (
                                                <i className="fa-solid fa-check text-correct dark:text-green-500 text-xl md:text-4xl mr-auto pl-2"></i>
                                            )}
                                            {hasAnswered && isSelected && !isCorrect && !isEssay && (
                                                <i className="fa-solid fa-xmark text-wrong dark:text-red-500 text-xl md:text-4xl mr-auto pl-2"></i>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>

                            <div className={`${expandClass}`} style={{ maxHeight: hasAnswered ? '1500px' : '0px', opacity: hasAnswered ? 1 : 0 }}>
                                <div className="mt-1 md:mt-4 border-2 border-accent dark:border-accent rounded-xl md:rounded-3xl p-4 md:p-8 bg-accent-light/60 dark:bg-gray-800 relative shadow-inner transition-colors">
                                    <div className="absolute -top-3 md:-top-5 right-6 md:right-8 bg-accent dark:bg-accent-dark text-white px-3 md:px-6 py-0.5 md:py-1.5 rounded-full font-bold text-sm md:text-lg shadow-md border-2 border-accent-light dark:border-gray-800">
                                        التعليل:
                                    </div>
                                    <FormattedText text={view.data.explanation} type="explanation" />
                                </div>
                            </div>

                            {/* أزرار التنقل (السابق والتالي) أسفل الصفحة */}
                            <div className="mt-4 md:mt-6 flex justify-between items-center">
                                <button 
                                    onClick={onPrev}
                                    disabled={currentIndex === 0}
                                    className={`flex items-center gap-2 md:gap-3 px-6 md:px-8 py-3 md:py-4 rounded-xl md:rounded-2xl border-2 font-bold text-lg md:text-xl transition-all ${currentIndex === 0 ? 'border-gray-200 dark:border-gray-700 text-gray-400 dark:text-gray-600 cursor-not-allowed' : 'border-accent text-accent-dark dark:text-accent-glow hover:bg-accent-light/60 dark:hover:bg-gray-800 active:scale-95'}`}
                                >
                                    <i className="fa-solid fa-arrow-right"></i>
                                    السابق
                                </button>

                                <button 
                                    onClick={onNext}
                                    disabled={currentIndex === totalQuestions - 1}
                                    className={`flex items-center gap-2 md:gap-3 px-8 md:px-10 py-3 md:py-4 rounded-xl md:rounded-2xl font-bold text-lg md:text-xl transition-all ${currentIndex === totalQuestions - 1 ? 'bg-gray-300 dark:bg-gray-700 text-gray-500 dark:text-gray-500 cursor-not-allowed' : 'bg-accent text-white hover:bg-accent-dark shadow-[0_10px_25px_-8px_rgba(5,150,105,0.6)] active:scale-95'}`}
                                >
                                    التالي
                                    <i className="fa-solid fa-arrow-left"></i>
                                </button>
                            </div>
                        </div>
                    </main>

                    {/* نافذة إحصائيات العداد التفاعلية */}
                    {showStatsModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 md:p-6 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={() => setShowStatsModal(false)}>
                            <div 
                                className="bg-white dark:bg-gray-900 rounded-2xl md:rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border-2 border-accent dark:border-accent overflow-hidden" 
                                onClick={(e) => e.stopPropagation()}

                                {/* Modal Header */}
                                <div className="flex items-center justify-between p-4 md:p-6 border-b border-gray-200 dark:border-gray-800 bg-gray-50/80 dark:bg-gray-800/50">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-full bg-accent-light dark:bg-accent-dark/40 flex items-center justify-center text-accent-dark dark:text-accent-glow text-xl">
                                            <i className="fa-solid fa-chart-pie"></i>

                                            <h3 className="text-lg md:text-2xl font-bold text-gray-900 dark:text-white">إحصائيات الأسئلة والتقدم</h3>

                                    <button 
                                        onClick={() => setShowStatsModal(false)}

                                    >
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                {/* Stat Cards */}
                                <div className="p-4 md:p-6 overflow-y-auto space-y-4">
                                    <div className="grid grid-cols-3 gap-2 md:gap-4 text-center">
                                        {/* Correct Card */}
                                        <div className="p-3 md:p-4 rounded-xl md:rounded-2xl bg-green-50 dark:bg-green-950/30 border border-green-200 dark:border-green-800/50">
                                            <div className="w-8 h-8 rounded-full bg-correct text-white mx-auto flex items-center justify-center text-sm md:text-base mb-1 shadow-sm">
                                                <i className="fa-solid fa-check"></i>
                                            </div>
                                            <div className="text-xl md:text-3xl font-black text-correct dark:text-green-400">{stats.correct}</div>
                                            <div className="text-xs md:text-sm font-bold text-gray-600 dark:text-gray-300">إجابة صحيحة</div>
                                        </div>

                                        {/* Wrong Card */}
                                        <div className="p-3 md:p-4 rounded-xl md:rounded-2xl bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-800/50">
                                            <div className="w-8 h-8 rounded-full bg-wrong text-white mx-auto flex items-center justify-center text-sm md:text-base mb-1 shadow-sm">
                                                <i className="fa-solid fa-xmark"></i>
                                            </div>
                                            <div className="text-xl md:text-3xl font-black text-wrong dark:text-red-400">{stats.wrong}</div>
                                            <div className="text-xs md:text-sm font-bold text-gray-600 dark:text-gray-300">إجابة خطأ</div>
                                        </div>

                                        {/* Unanswered / Skipped Card */}
                                        <div className="p-3 md:p-4 rounded-xl md:rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/50">
                                            <div className="w-8 h-8 rounded-full bg-amber-500 text-white mx-auto flex items-center justify-center text-sm md:text-base mb-1 shadow-sm">
                                                <i className="fa-solid fa-forward"></i>

                                        </div>
                                    </div>

                                    {/* Progress Bar */}
                                    <div className="bg-gray-100 dark:bg-gray-800 p-3 rounded-xl">
                                        <div className="flex justify-between items-center text-xs md:text-sm font-bold mb-1.5">
                                            <span className="text-gray-600 dark:text-gray-400">نسبة الإنجاز الكلي</span>
                                            <span className="text-accent-dark dark:text-accent-glow font-black">{stats.answered} من {totalQuestions} ({stats.percentage}%)</span>
                                        </div>
                                        <div className="w-full h-2.5 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden flex">
                                            <div style={{ width: `${(stats.correct / totalQuestions) * 100}%` }} className="bg-correct transition-all duration-300" title={`صحيحة: ${stats.correct}`}></div>
                                            <div style={{ width: `${(stats.wrong / totalQuestions) * 100}%` }} className="bg-wrong transition-all duration-300" title={`خطأ: ${stats.wrong}`}></div>
                                        </div>
                                    </div>

                                    {/* Questions Grid */}
                                    <div>
                                        <h4 className="text-sm md:text-base font-bold text-gray-700 dark:text-gray-300 mb-2 flex items-center justify-between">
                                            <span>خريطة الأسئلة:</span>
                                            <span className="text-xs font-normal text-gray-400">اضغط على أي رقم للانتقال له</span>
                                        </h4>
                                        <div className="grid grid-cols-6 sm:grid-cols-8 md:grid-cols-10 gap-1.5 md:gap-2 max-h-56 md:max-h-64 overflow-y-auto p-1.5 border border-gray-200 dark:border-gray-800 rounded-xl bg-gray-50/50 dark:bg-gray-800/30">
                                            {questions.map((q, idx) => {
                                                const ans = answers[idx];
                                                const isCur = idx === currentIndex;
                                                let btnColor = "bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border-gray-200 dark:border-gray-700 hover:border-accent";
                                                
                                                if (ans !== undefined) {
                                                    if (q.type === 'essay') {
                                                        btnColor = "bg-green-100 dark:bg-green-900/40 text-correct dark:text-green-400 border-green-300 dark:border-green-700 font-bold";
                                                    } else if (ans === q.correctAnswer) {
                                                        btnColor = "bg-correct text-white border-green-600 font-bold";
                                                    } else {
                                                        btnColor = "bg-wrong text-white border-red-600 font-bold";
                                                    }
                                                }

                                                return (
                                                    <button
                                                        key={idx}
                                                        onClick={() => {
                                                            if (onJumpToQuestion) onJumpToQuestion(idx);
                                                            setShowStatsModal(false);
                                                        }}
                                                        className={`h-9 md:h-10 text-xs md:text-sm rounded-lg border-2 flex items-center justify-center transition-all ${btnColor} ${isCur ? 'ring-2 ring-secondary-dark ring-offset-1 dark:ring-offset-gray-900 font-black scale-105 shadow-md' : 'active:scale-95'}`}
                                                        title={`سؤال ${idx + 1}`}
                                                    >
                                                        {idx + 1}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                {/* Modal Footer */}
                                <div className="p-3 md:p-4 bg-gray-50 dark:bg-gray-800/50 border-t border-gray-200 dark:border-gray-800 flex justify-end">
                                    <button
                                        onClick={() => setShowStatsModal(false)}
                                        className="px-5 py-2 rounded-xl bg-accent text-white font-bold hover:bg-accent-dark transition-all text-sm md:text-base shadow-sm active:scale-95"
                                    >
                                        متابعة الاختبار
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <DrawingOverlay isActive={isDrawingMode} onClose={() => setIsDrawingMode(false)} />
                </div>
            );
        };

                const DHIKR_LIST = [
            "اللهم صلِّ وسلّم على نبينا محمد",
            "الحمد لله رب العالمين",
            "الحمد لله حمداً كثيراً طيباً مباركاً فيه",
            "الحمد لله الذي بنعمته تتم الصالحات",
            "اللهم لك الحمد والشكر",
            "سبحان الله وبحمده، سبحان الله العظيم",
            "سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر",
            "سبحان الله وبحمده، عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته",
            "لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير",
            "لا إله إلا الله العظيم الحليم",
            "أستغفر الله العظيم وأتوب إليه",
            "اللهم اغفر لي وارحمني واهدني وعافني وارزقني",
            "رب اغفر لي وتب علي إنك أنت التواب الرحيم",
            "اللهم لا سهل إلا ما جعلته سهلاً، وأنت تجعل الحزن إذا شئت سهلاً",
            "اللهم إني أسألك علماً نافعاً، ورزقاً طيباً، وعملاً متقبلاً",
            "لا حول ولا قوة إلا بالله",
            "حسبي الله ونعم الوكيل",
            "حسبنا الله ونعم الوكيل، على الله توكلنا",
            "بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله",
            "يا حي يا قيوم برحمتك أستغيث، أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين",
            "بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم",
            "اللهم إني أسألك العفو والعافية في الدنيا والآخرة",
            "لا إله إلا أنت سبحانك إني كنت من الظالمين",
            "اللهم يا مقلب القلوب ثبت قلبي على دينك",
            "اللهم إني أسألك التوفيق والسداد"
        ];

        const DhikrModal = ({ dhikr, onDismiss }) => {
            const [secondsLeft, setSecondsLeft] = useState(10);

            useEffect(() => {
                const timer = setInterval(() => {
                    setSecondsLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            onDismiss();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [onDismiss]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md animate-fade-in" onClick={onDismiss}>
                    <div 
                        className="bg-white dark:bg-gray-900 rounded-3xl max-w-xl w-full p-6 md:p-8 shadow-2xl border-2 border-emerald-500/60 dark:border-emerald-500 flex flex-col items-center text-center relative overflow-hidden"
                        onClick={(e) => e.stopPropagation()}
                    >
                        {/* شريط زمني للعد التنازلي */}
                        <div className="absolute top-0 left-0 right-0 h-1.5 bg-gray-200 dark:bg-gray-800">
                            <div 
                                className="h-full bg-gradient-to-r from-emerald-500 to-accent transition-all duration-1000 ease-linear"
                                style={{ width: `${(secondsLeft / 10) * 100}%` }}
                            ></div>
                        </div>

                        {/* شارة الهيدر الإيمانية */}
                        <div className="mt-2 inline-flex items-center gap-2 bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300 px-4 py-1.5 rounded-full text-xs md:text-sm font-bold shadow-sm border border-emerald-300 dark:border-emerald-700">
                            <i className="fa-solid fa-hands-praying text-emerald-600 dark:text-emerald-400 text-sm"></i>
                            <span>استراحة إيمانية</span>
                        </div>

                        <h3 className="mt-4 text-base md:text-lg font-bold text-gray-700 dark:text-gray-300 flex items-center justify-center gap-2">
                            <i className="fa-solid fa-heart text-emerald-600 text-xs"></i>
                            لا تنسَ ذكر الله والصلاة على حبيبنا رسول الله ﷺ
                            <i className="fa-solid fa-heart text-emerald-600 text-xs"></i>
                        </h3>

                        {/* صندوق نص الذكر */}
                        <div className="my-5 w-full bg-gradient-to-b from-emerald-50/70 to-emerald-100/40 dark:from-emerald-950/30 dark:to-gray-800/60 border-2 border-emerald-300 dark:border-emerald-700/60 rounded-2xl p-6 md:p-8 shadow-inner relative">
                            <i className="fa-solid fa-quote-right text-emerald-300 dark:text-emerald-800 text-2xl md:text-3xl absolute top-3 right-3 opacity-50"></i>
                            <p className="text-xl md:text-2xl font-black text-emerald-900 dark:text-emerald-100 leading-relaxed drop-shadow-sm select-text">
                                {dhikr}
                            </p>
                            <i className="fa-solid fa-quote-left text-emerald-300 dark:text-emerald-800 text-2xl md:text-3xl absolute bottom-3 left-3 opacity-50"></i>
                        </div>

                        {/* مؤقت الثواني وزر المتابعة */}
                        <div className="w-full flex flex-col md:flex-row items-center justify-between gap-3 mt-2">
                            <div className="flex items-center gap-2 text-xs md:text-sm text-gray-500 dark:text-gray-400">
                                <i className="fa-regular fa-clock text-emerald-600 animate-spin" style={{ animationDuration: '3s' }}></i>
                                <span>الانتقال التلقائي خلال: <strong className="text-emerald-700 dark:text-emerald-400 text-base">{secondsLeft}</strong> ثوانٍ</span>
                            </div>

                            <button
                                onClick={onDismiss}
                                className="w-full md:w-auto px-6 py-2.5 rounded-xl bg-accent hover:bg-accent-dark text-white font-bold text-sm md:text-base shadow-md transition-all active:scale-95 flex items-center justify-center gap-2"
                            >
                                <span>متابعة الاختبار</span>
                                <i className="fa-solid fa-arrow-left"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

                const shuffleQuizOptions = (data) => {
            return data.map(q => {
                if (q.type !== 'mcq' || !Array.isArray(q.options) || q.options.length <= 1) {
                    return { ...q };
                }
                const indexed = q.options.map((opt, i) => ({ opt, isCorrect: i === q.correctAnswer }));
                for (let i = indexed.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
                }
                return {
                    ...q,
                    options: indexed.map(item => item.opt),
                    correctAnswer: indexed.findIndex(item => item.isCorrect)
                };
            });
        };

        const STORAGE_KEY_PROGRESS = 'quiz_progress_unit1';
        const STORAGE_KEY_THEME = 'quiz_dark_mode';

        const App = () => {
            const [screen, setScreen] = useState('home'); 
            const [questions, setQuestions] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY_PROGRESS);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.questions && Array.isArray(parsed.questions) && parsed.questions.length === QUIZ_DATA.length) {
                            return parsed.questions;
                        } else if (parsed.answers && Object.keys(parsed.answers).length > 0) {
                            return QUIZ_DATA;
                        }
                    }
                } catch(e) {}
                return shuffleQuizOptions(QUIZ_DATA);
            });
            const [currentIndex, setCurrentIndex] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY_PROGRESS);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (typeof parsed.currentIndex === 'number' && parsed.currentIndex < QUIZ_DATA.length) {
                            return parsed.currentIndex;
                        }
                    }
                } catch(e) {}
                return 0;
            });
            const [answers, setAnswers] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY_PROGRESS);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return parsed.answers || {};
                    }
                } catch(e) {}
                return {};
            }); 
            const [showDhikrModal, setShowDhikrModal] = useState(false);
            const [currentDhikr, setCurrentDhikr] = useState("");
            const [pendingNextIndex, setPendingNextIndex] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                try {
                    return localStorage.getItem(STORAGE_KEY_THEME) === 'true';
                } catch(e) {}
                return false;
            });

            // حفظ التقدم تلقائياً عند تغيير السؤال أو الإجابات
            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify({
                        currentIndex,
                        answers,
                        questions,
                        lastUpdated: Date.now()
                    }));
                } catch(e) {}
            }, [currentIndex, answers, questions]);

            // تطبيق وحفظ الوضع الليلي
            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY_THEME, isDarkMode ? 'true' : 'false');
                } catch(e) {}
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const toggleDarkMode = () => setIsDarkMode(!isDarkMode);

            const hasProgress = Object.keys(answers).length > 0 || currentIndex > 0;

            const handleStart = () => {
                try {
                    localStorage.removeItem(STORAGE_KEY_PROGRESS);
                } catch(e) {}
                const fresh = shuffleQuizOptions(QUIZ_DATA);
                setQuestions(fresh);
                setCurrentIndex(0);
                setAnswers({});
                setScreen('quiz');
            };

            const handleResume = () => {
                setScreen('quiz');
            };

            const handleRestart = () => {
                try {
                    localStorage.removeItem(STORAGE_KEY_PROGRESS);
                } catch(e) {}
                const fresh = shuffleQuizOptions(QUIZ_DATA);
                setQuestions(fresh);
                setCurrentIndex(0);
                setAnswers({});
                setScreen('quiz');
            };

            const handleNext = () => {
                if (currentIndex < questions.length - 1) {
                    const nextIdx = currentIndex + 1;
                    // بعد كل 10 أسئلة (أي عند السؤال 10، 20، 30... حيث currentIndex هو 9، 19، 29...)
                    if ((currentIndex + 1) % 10 === 0) {
                        const dhikrIdx = (Math.floor((currentIndex + 1) / 10) - 1) % DHIKR_LIST.length;
                        setCurrentDhikr(DHIKR_LIST[dhikrIdx]);
                        setPendingNextIndex(nextIdx);
                        setShowDhikrModal(true);
                    } else {
                        setCurrentIndex(nextIdx);
                    }
                }
            };

            const handleDismissDhikr = () => {
                setShowDhikrModal(false);
                if (pendingNextIndex !== null) {
                    setCurrentIndex(pendingNextIndex);
                    setPendingNextIndex(null);
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(prev => prev - 1);
                }
            };

            const handleAnswer = (optionIndex) => {
                setAnswers(prev => ({ ...prev, [currentIndex]: optionIndex }));
            };

            return (
                <div className={`h-screen w-screen flex flex-col bg-white dark:bg-[#0f1115] overflow-hidden text-gray-900 dark:text-gray-100 selection:bg-accent selection:text-white transition-colors duration-300`}>
                    {screen === 'home' && (
                        <HomeScreen 
                            onStart={handleStart} 
                            hasProgress={hasProgress} 
                            onResume={handleResume} 
                            onRestart={handleRestart} 
                        />
                    )}
                    
                    {screen === 'quiz' && (
                        <QuizScreen 
                            questions={questions}
                            questionData={questions[currentIndex]}
                            currentIndex={currentIndex}
                            totalQuestions={questions.length}
                            onNext={handleNext}
                            onPrev={handlePrev}
                            onHome={() => setScreen('home')}
                            userAnswer={answers[currentIndex]}
                            onAnswer={handleAnswer}
                            toggleDarkMode={toggleDarkMode}
                            isDarkMode={isDarkMode}
                            answers={answers}
                            onJumpToQuestion={(idx) => setCurrentIndex(idx)}
                        />
                    )}

                    {showDhikrModal && (
                        <DhikrModal 
                            dhikr={currentDhikr} 
                            onDismiss={handleDismissDhikr} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
